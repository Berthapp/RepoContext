name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  pack-tool:
    name: Pack NuGet packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Allow GitHub to issue an OIDC token for NuGet Trusted Publishing
      # (keyless publish; the matching policy lives on nuget.org).
      id-token: write
    # Job-level so the steps' `if:` can see it (step-level env is not
    # visible to the same step's condition). NUGET_USER is the nuget.org
    # profile name that owns the trusted publishing policy.
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      # The tag only triggers this workflow; the package version comes from
      # VersionPrefix. Fail fast when they disagree, otherwise the push would
      # silently --skip-duplicate an already-published version.
      - name: Verify tag matches VersionPrefix
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag v$tag does not match VersionPrefix $version in Directory.Build.props. Bump the version, then re-tag."
            exit 1
          fi
      - name: Pack
        # The tool package embeds the publish output; trim the ~24 unused
        # tree-sitter grammars there too (same switch as the self-contained
        # builds), or the package balloons to >80 MB.
        run: >
          dotnet pack src/RepoContext.Cli/RepoContext.Cli.csproj
          -c Release -p:TrimTreeSitterGrammars=true -o artifacts/nupkg
      # The PackageReference distribution (ADR 0014): same CLI, delivered by
      # plain NuGet restore for environments that block `dotnet tool install`.
      # Grammar trimming is forced inside this project's pack target.
      - name: Pack MSBuild package
        run: >
          dotnet pack src/RepoContext.MSBuild/RepoContext.MSBuild.csproj
          -c Release -o artifacts/nupkg
      - uses: actions/upload-artifact@v7
        with:
          name: repoctx-nupkgs
          path: artifacts/nupkg/*.nupkg
      # Publish to NuGet.org only for tag builds, and only when the NUGET_USER
      # secret is configured. Trusted Publishing: exchange the GitHub OIDC
      # token for a 1-hour API key against the policy registered on nuget.org
      # (repo Berthapp/RepoContext, workflow release.yml). No long-lived key.
      - name: NuGet login (OIDC -> temp API key)
        if: startsWith(github.ref, 'refs/tags/v') && env.NUGET_USER != ''
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      # --skip-duplicate makes re-runs idempotent.
      - name: Push to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v') && env.NUGET_USER != ''
        run: >
          dotnet nuget push "artifacts/nupkg/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  self-contained:
    name: Self-contained (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every runtime identifier here is also an npm platform package (see the
        # npm job below), so this matrix and npm/repocontext/lib/platform.js must
        # list the same set — the npm builder fails the release if one is missing.
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: win-x64
            os: windows-latest
          # Cross-published from the x64 Windows runner: GitHub offers no
          # Windows-on-ARM runner, and the native dependencies ship win-arm64
          # binaries, so the publish output is complete either way.
          - rid: win-arm64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
          # Cross-published from the Apple-silicon runner, for the same reason
          # as win-arm64 above. Targeting the Intel image instead ties the
          # release to whichever label GitHub currently offers for it — macos-13
          # was retired mid-release and the job queued forever, blocking every
          # downstream job. A self-contained publish only needs the target's
          # runtime pack, not a host of that architecture.
          - rid: osx-x64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Publish
        run: >
          dotnet publish src/RepoContext.Cli/RepoContext.Cli.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:TrimTreeSitterGrammars=true
          -o artifacts/${{ matrix.rid }}
      # Package each RID as a single downloadable archive for the release:
      # .zip for Windows, .tar.gz elsewhere.
      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        run: tar -czf repoctx-${{ matrix.rid }}.tar.gz -C artifacts/${{ matrix.rid }} .
      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path artifacts/${{ matrix.rid }}/* -DestinationPath repoctx-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: repoctx-${{ matrix.rid }}
          path: |
            repoctx-${{ matrix.rid }}.tar.gz
            repoctx-${{ matrix.rid }}.zip
          if-no-files-found: error

  npm-publish:
    name: npm packages
    needs: [self-contained]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm publish --provenance.
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # Trusted publishing needs npm >= 11.5.1 on Node >= 22.14; the runner
      # image lags both. setup-node is deliberately used *without* registry-url:
      # that input writes an _authToken line into .npmrc, and an .npmrc with an
      # auth line — even an empty one — makes npm take the legacy token path and
      # ignore OIDC entirely.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Unit-test the launcher
        run: |
          node --version
          node --test npm/repocontext/test/platform.test.mjs

      - name: Download self-contained archives
        uses: actions/download-artifact@v8
        with:
          pattern: repoctx-*
          path: archives
          merge-multiple: true

      # The npm packages carry the same payload as the release archives. Going
      # through the archives (rather than uploading the publish directories
      # directly) keeps the executable bit intact: an artifact upload does not
      # preserve file modes, a tar does.
      - name: Unpack archives per runtime identifier
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in archives/repoctx-*.tar.gz; do
            rid=$(basename "$archive" .tar.gz); rid=${rid#repoctx-}
            mkdir -p staging/"$rid"
            tar -xzf "$archive" -C staging/"$rid"
          done
          for archive in archives/repoctx-*.zip; do
            rid=$(basename "$archive" .zip); rid=${rid#repoctx-}
            mkdir -p staging/"$rid"
            unzip -q "$archive" -d staging/"$rid"
          done
          ls staging

      - name: Build npm packages
        run: node npm/build-packages.mjs --artifacts staging --out npm/dist

      - uses: actions/upload-artifact@v7
        with:
          name: repoctx-npm
          path: npm/dist/*/package.json

      # Publishing prefers trusted publishing (OIDC): npm exchanges this job's
      # GitHub identity for a short-lived credential, so no long-lived token is
      # stored anywhere and provenance is attested automatically. That requires
      # a trusted publisher registered per package on npmjs.com — which npm
      # only lets you configure once the package exists. NPM_TOKEN therefore
      # remains supported as the bootstrap path for a package's first-ever
      # version; once every package is registered, delete the secret and this
      # step silently switches to OIDC.
      #
      # Platform packages go first: the wrapper declares them as optional
      # dependencies, so publishing it first would briefly resolve to nothing.
      # `npm view` makes re-runs idempotent the way --skip-duplicate does for
      # NuGet.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN is set: publishing with the bootstrap token."
            # Written here rather than by setup-node; the token stays in the
            # runner's home directory and never reaches a repository file.
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
            trap 'rm -f "$HOME/.npmrc"' EXIT
            # Provenance is explicit on this path; OIDC attests it on its own.
            provenance=(--provenance)
          else
            echo "No NPM_TOKEN: publishing via trusted publishing (OIDC)."
            # Any auth line at all sends npm down the legacy token path, so make
            # sure a stray .npmrc from the image or an action cannot shadow OIDC.
            rm -f "$HOME/.npmrc"
            provenance=()
          fi
          publish() {
            name=$(node -p "require('./$1/package.json').name")
            version=$(node -p "require('./$1/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping."
              return
            fi
            npm publish "$1" --access public "${provenance[@]}"
          }
          for dir in npm/dist/repocontext-*; do publish "$dir"; done
          publish npm/dist/repocontext

  github-release:
    name: GitHub Release
    needs: [pack-tool, self-contained, npm-publish]
    runs-on: ubuntu-latest
    # Only cut a release for pushed version tags.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # Draft so the release notes and attached binaries can be reviewed
        # before it is made public. Attaches the self-contained archives and
        # the NuGet package for direct download.
        run: >
          gh release create "${{ github.ref_name }}"
          dist/repoctx-*.tar.gz dist/repoctx-*.zip dist/*.nupkg
          --repo "${{ github.repository }}"
          --title "RepoContext ${{ github.ref_name }}"
          --draft
          --generate-notes
